<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | RiGiD</title>


    <!-- =====================================================
         FONTS
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         TAILWIND
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"
    ></script>


    <!-- =====================================================
         GLOBAL CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../styles.css"
    >


    <!-- =====================================================
         LOGIN CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="login.css"
    >


    <!-- =====================================================
         THEME
         ===================================================== -->

    <script>

        if (
            localStorage.getItem("logbook-theme") === "dark" ||
            (
                !localStorage.getItem("logbook-theme") &&
                window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches
            )
        ) {

            document.documentElement.classList.add(
                "dark"
            );

        }

    </script>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    ></script>

</head>


<body class="min-h-screen flex flex-col login-bg">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header-bar">

        <div
            class="w-full px-4 sm:px-6 py-4 flex items-center justify-between"
        >

            <!-- BRAND -->

            <div class="flex items-center gap-3">

                <span class="logo-mark">
                    RiG
                </span>


                <div>

                    <h1
                        class="font-display text-lg sm:text-xl font-semibold tracking-tight"
                    >
                        RiGiD
                    </h1>


                    <p
                        id="liveClock"
                        class="font-mono text-[11px] uppercase tracking-widest text-soft mt-1"
                    ></p>

                </div>

            </div>


            <!-- THEME -->

            <button
                id="themeToggle"
                class="icon-btn"
                type="button"
                title="Toggle dark mode"
                aria-label="Toggle dark mode"
            >

                <span id="themeIcon">
                    ☾
                </span>

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main
        class="flex-1 flex flex-col items-center justify-center px-4 py-10"
    >


        <!-- =================================================
             BRAND HERO
             ================================================= -->

        <div class="brand-hero">

            <h2 class="brand-wordmark">

                R<span class="wordmark-i">i</span>G<span class="wordmark-i">i</span>D

            </h2>


            <p class="brand-tagline">
                "And miles to go sleep before we sleep"
            </p>

        </div>



        <!-- =================================================
             AUTH CARD
             ================================================= -->

        <div class="auth-card">


            <!-- =================================================
                 TABS
                 ================================================= -->

            <div class="auth-tabs">

                <button
                    id="tabLogin"
                    class="auth-tab is-active"
                    type="button"
                >
                    Log In
                </button>


                <button
                    id="tabSignup"
                    class="auth-tab"
                    type="button"
                >
                    Sign Up
                </button>

            </div>



            <!-- =================================================
                 GLOBAL MESSAGE
                 ================================================= -->

            <div
                id="authMessage"
                class="auth-message hidden"
                role="alert"
            ></div>



            <!-- =================================================
                 LOGIN FORM
                 ================================================= -->

            <form
                id="loginForm"
                class="auth-form"
            >


                <!-- EMAIL -->

                <div>

                    <label
                        class="field-label"
                        for="loginEmail"
                    >
                        Username
                    </label>


                    <input
                        id="loginEmail"
                        type="email"
                        class="field-input"
                        placeholder="you@kct.ac.in"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div>

                    <label
                        class="field-label"
                        for="loginPassword"
                    >
                        Password
                    </label>


                    <input
                        id="loginPassword"
                        type="password"
                        class="field-input"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="btn-primary w-full justify-center"
                >
                    Log In
                </button>

            </form>



            <!-- =================================================
                 SIGNUP FORM
                 ================================================= -->

            <form
                id="signupForm"
                class="auth-form hidden"
            >


                <!-- =================================================
                     NORMAL EMAIL SIGNUP
                     ================================================= -->

                <div id="emailSignupFields">


                    <!-- =================================================
                         EMAIL
                         ================================================= -->

                    <div>

                        <label
                            class="field-label"
                            for="signupEmail"
                        >
                            KCT Email
                        </label>


                        <input
                            id="signupEmail"
                            type="email"
                            class="field-input"
                            placeholder="you@kct.ac.in"
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- =================================================
                         FORUM
                         ================================================= -->

                    <div>

                        <label
                            class="field-label"
                            for="signupForum"
                        >
                            Forum
                            <span class="required-mark">
                                *
                            </span>
                        </label>


                        <select
                            id="signupForum"
                            class="field-input"
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select your forum
                            </option>

                        </select>


                        <p class="field-hint">
                            Select at least one forum.
                        </p>

                    </div>



                    <!-- =================================================
                         SELECTED FORUMS
                         ================================================= -->

                    <div
                        id="selectedForumsContainer"
                        class="selected-forums-container"
                    ></div>



                    <!-- =================================================
                         PASSWORD
                         ================================================= -->

                    <div>

                        <label
                            class="field-label"
                            for="signupPassword"
                        >
                            Create Password
                        </label>


                        <input
                            id="signupPassword"
                            type="password"
                            class="field-input"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- =================================================
                         CONFIRM PASSWORD
                         ================================================= -->

                    <div>

                        <label
                            class="field-label"
                            for="signupPassword2"
                        >
                            Confirm Password
                        </label>


                        <input
                            id="signupPassword2"
                            type="password"
                            class="field-input"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- =================================================
                         SEND VERIFICATION
                         ================================================= -->

                    <button
                        id="sendVerificationBtn"
                        type="button"
                        class="btn-secondary w-full justify-center"
                    >
                        Send Verification Link
                    </button>



                    <!-- =================================================
                         RESEND VERIFICATION
                         ================================================= -->

                    <div
                        id="resendVerificationBox"
                        class="resend-verification-box hidden"
                    >

                        <button
                            id="resendVerificationBtn"
                            type="button"
                            class="resend-link"
                        >
                            Resend verification link
                        </button>

                    </div>



                    <!-- =================================================
                         VERIFICATION STATUS
                         ================================================= -->

                    <p
                        id="verificationStatus"
                        class="field-hint hidden"
                    ></p>

                </div>



                <!-- =================================================
                     GOOGLE DIVIDER
                     ================================================= -->

                <div
                    class="auth-divider"
                    id="googleDivider"
                >

                    <span>
                        OR
                    </span>

                </div>



                <!-- =================================================
                     GOOGLE SIGNUP BUTTON
                     ================================================= -->

                <button
                    id="googleSignupBtn"
                    type="button"
                    class="google-btn"
                >

                    <span class="google-icon">
                        G
                    </span>

                    Continue with Google

                </button>



                <!-- =================================================
                     GOOGLE PROFILE SETUP
                     ================================================= -->

                <div
                    id="googleProfileSetup"
                    class="google-profile-setup hidden"
                >


                    <!-- =================================================
                         GOOGLE USER INFORMATION
                         ================================================= -->

                    <div class="google-user-info">

                        <div
                            id="googleUserName"
                            class="google-user-name"
                        ></div>


                        <div
                            id="googleUserEmail"
                            class="google-user-email"
                        ></div>

                    </div>



                    <!-- =================================================
                         GOOGLE FORUM
                         ================================================= -->

                    <div>

                        <label
                            class="field-label"
                            for="googleForum"
                        >
                            Forum
                            <span class="required-mark">
                                *
                            </span>
                        </label>


                        <select
                            id="googleForum"
                            class="field-input"
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select your forum
                            </option>

                        </select>


                        <p class="field-hint">
                            Select at least one forum.
                        </p>

                    </div>



                    <!-- =================================================
                         GOOGLE SELECTED FORUMS
                         ================================================= -->

                    <div
                        id="googleSelectedForumsContainer"
                        class="selected-forums-container"
                    ></div>



                    <!-- =================================================
                         GOOGLE PASSWORD
                         ================================================= -->

                    <div id="googlePasswordBox">


                        <!-- PASSWORD -->

                        <div>

                            <label
                                class="field-label"
                                for="googlePassword"
                            >
                                Create Password
                            </label>


                            <input
                                id="googlePassword"
                                type="password"
                                class="field-input"
                                minlength="8"
                                autocomplete="new-password"
                            >

                        </div>



                        <!-- CONFIRM PASSWORD -->

                        <div>

                            <label
                                class="field-label"
                                for="googlePassword2"
                            >
                                Confirm Password
                            </label>


                            <input
                                id="googlePassword2"
                                type="password"
                                class="field-input"
                                minlength="8"
                                autocomplete="new-password"
                            >

                        </div>


                        <p class="field-hint">
                            Create a password so you can also log in using your email.
                        </p>

                    </div>



                    <!-- =================================================
                         GOOGLE REQUEST ACCESS
                         ================================================= -->

                    <button
                        id="googleRequestAccessBtn"
                        type="button"
                        class="btn-primary w-full justify-center"
                    >
                        Request Access
                    </button>



                    <!-- =================================================
                         DIFFERENT GOOGLE ACCOUNT
                         ================================================= -->

                    <div class="resend-verification-box">

                        <button
                            id="googleUseDifferentAccountBtn"
                            type="button"
                            class="resend-link"
                        >
                            Not you? Use a different Google account
                        </button>

                    </div>

                </div>



                <!-- =================================================
                     NORMAL REQUEST ACCESS
                     ================================================= -->

                <button
                    id="requestAccessBtn"
                    type="submit"
                    class="btn-primary w-full justify-center"
                    disabled
                >
                    Request Access
                </button>


            </form>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="border-t border-token">

        <div
            class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-center"
        >

            <p
                class="font-mono text-[11px] text-soft"
            >
                RiGiD · A Project Manager
            </p>

        </div>

    </footer>



    <!-- =====================================================
         SUPABASE CLIENT
         ===================================================== -->

    <script
        src="../supabase-client.js"
    ></script>

    <script src="../google-drive-reconnect.js"></script>

    <!-- =====================================================
         LOGIN LOGIC
         ===================================================== -->

    <script
        src="login.js"
    ></script>

</body>

</html>
